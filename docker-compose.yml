# Environnement de développement : API + worker + PostgreSQL + Redis + MinIO (stockage objets).
# Usage : docker compose up   (API sur http://localhost:8000, front sur http://localhost:3000)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ftth
      POSTGRES_PASSWORD: ftth
      POSTGRES_DB: ftth
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftth -d ftth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ftth
      MINIO_ROOT_PASSWORD: ftth-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command: >
      sh -c "composer install --no-interaction &&
             (test -f .env || cp .env.example .env) &&
             php artisan key:generate --no-interaction &&
             php artisan migrate --seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes: [./backend:/var/www/html]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  queue:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan queue:work --tries=3 --timeout=300"
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes: [./backend:/var/www/html]
    depends_on: [api]

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: [./frontend:/app]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
